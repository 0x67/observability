[package]
name = "observability"
description = "Tracing + metrics backend wiring (subscriber pipeline, metrics recorder, shared OTLP) over observability-core"
version = "0.2.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false
readme = "README.md"
keywords = ["observability", "tracing", "metrics", "opentelemetry", "otlp"]
categories = ["development-tools::debugging"]

[dependencies]
observability-core = { path = "../observability-core" }
# Always present: the facades + logging sinks.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
metrics = { workspace = true }
thiserror = { workspace = true }
# `serde`: Deserialize for every config type, so a service reads its config from a file.
serde = { workspace = true, optional = true }
# otel grouping feature.
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
# OTLP export runtime and the async HTTP client that runs on it.
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "net", "time"] }
opentelemetry-http = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
http = { workspace = true, optional = true }
# `tls`: checks the OS store at init so both transports fail the same way when it is empty.
rustls-native-certs = { workspace = true, optional = true }
# `tls-platform-verifier`: the OS certificate verifier on both transports.
rustls-platform-verifier = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
# per-signal / per-exporter.
opentelemetry-appender-tracing = { workspace = true, optional = true }
metrics-exporter-prometheus = { workspace = true, optional = true }
# `MetricKindMask` for the Prometheus idle timeout; the exporter does not re-export it.
metrics-util = { workspace = true, optional = true }
metrics-exporter-otel = { workspace = true, optional = true }
tracing-bunyan-formatter = { workspace = true, optional = true }

# Signal features are named to never collide with the `tracing` / `metrics` crate deps.
# `otel` is the grouping feature that pulls the SDK + OTLP transport; every
# `#[cfg(feature = "otel")]` block resolves against it.
[features]
default = ["logging", "otel", "tls", "metrics-prom"]
logging = []
otel = [
  "dep:opentelemetry",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-otlp",
  "dep:tracing-opentelemetry",
  "dep:tokio",
  "dep:opentelemetry-http",
  "dep:reqwest",
  "dep:async-trait",
  "dep:http",
]
# TLS for `https://` endpoints only; `http://` stays plain text. ring is the crypto provider
# unless the app installs a process-wide one first.
tls = [
  "otel",
  "opentelemetry-otlp?/tls-roots",
  "reqwest?/rustls-tls-native-roots",
  "dep:rustls-native-certs",
]
tls-webpki-roots = [
  "tls",
  "opentelemetry-otlp?/tls-webpki-roots",
  "reqwest?/rustls-tls-webpki-roots",
]
# The OS verifier (Security.framework, Windows, Android, or webpki over the OS store), for
# desktop and mobile apps. Android apps must also run the verifier's JNI init.
tls-platform-verifier = [
  "tls",
  "dep:rustls-platform-verifier",
  "dep:rustls",
  "dep:tonic",
]
otel-traces = ["otel"]
otel-logs = ["otel", "dep:opentelemetry-appender-tracing"]
metrics-prom = ["dep:metrics-exporter-prometheus", "dep:metrics-util"]
metrics-otel = ["otel", "dep:metrics-exporter-otel"]
bunyan = ["dep:tracing-bunyan-formatter"]
serde = ["dep:serde"]

[dev-dependencies]
rcgen = { workspace = true }
serde_json = { workspace = true }
metrics-util = { workspace = true, features = ["debugging"] }
rustls = { workspace = true }
tonic = { workspace = true, features = ["transport", "router", "codegen", "tls-ring"] }
opentelemetry-proto = { workspace = true, features = [
  "gen-tonic",
  "trace",
  "logs",
  "metrics",
] }
