[package]
name = "observability-core"
description = "Runtime metrics gate and hot-path telemetry helpers (metrics + hdrhistogram only)"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false
readme = "README.md"
keywords = ["observability", "metrics", "latency", "hot-path"]
categories = ["development-tools::profiling"]

[dependencies]
metrics = { workspace = true }
hdrhistogram = { workspace = true }
# flusher task only; leaf crate stays otel-free. `rt` for spawn, `time` for the tick.
tokio = { workspace = true, optional = true, features = ["rt", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "time", "macros", "test-util"] }
# DebuggingRecorder for the flusher tests
metrics-util = { version = "0.20.4", default-features = false, features = ["debugging"] }

[features]
# 100ms-tick flusher that drains histograms and emits gauges/counters.
flush-tokio = ["dep:tokio"]

[[bench]]
name = "hot_path"
harness = false
