[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.88.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/0x67/observability"
homepage = "https://github.com/0x67/observability"
authors = ["0x67 <69191110+0x67@users.noreply.github.com>"]
publish = false

# The opentelemetry crates, tracing-opentelemetry, opentelemetry-http, and
# opentelemetry-proto move as one family: every signal and the metrics recorder
# must share one opentelemetry version.
[workspace.dependencies]
# hot-path core (observability-core)
metrics = "0.24"
hdrhistogram = "7"
tokio = "1.54.1"
# backend: tracing stack
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"
tracing-bunyan-formatter = "0.3"
# backend: opentelemetry 0.33
tracing-opentelemetry = "0.34.0"
opentelemetry = "0.33.1"
opentelemetry_sdk = "0.33.1"
# default features off: no reqwest-blocking-client, so HTTP export uses the crate's async client
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = [
  "grpc-tonic",
  "http-proto",
  "trace",
  "metrics",
  "logs",
  "internal-logs",
] }
opentelemetry-http = { version = "0.33.1", default-features = false, features = ["reqwest"] }
reqwest = { version = "0.13.5", default-features = false }
async-trait = "0.1.89"
rustls-native-certs = "0.8.4"
http = "1.4.2"
# the HTTP client's rustls config and the test servers; aws-lc-rs is the only provider
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
webpki-roots = "1.0.12"
# `tls-platform-verifier`: the OS verifier, plus the tonic API it plugs into
rustls-platform-verifier = "0.7.1"
tonic = { version = "0.14.6", default-features = false, features = ["channel"] }
opentelemetry-proto = { version = "0.33.1", default-features = false }
# test-only: certificates generated at test time, so no key or expiring PEM is committed
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
opentelemetry-appender-tracing = "0.33.1"
# backend: metrics exporters
# only the listener: `push-gateway` pulls hyper-rustls with aws-lc-rs, which nothing here uses
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = [
  "http-listener",
] }
# `MetricKindMask` for the Prometheus idle timeout; tests add `debugging` for the
# in-memory recorder
metrics-util = { version = "0.20.4", default-features = false }
# shared
thiserror = "2.0.18"
# config files behind the `serde` feature; serde_json is test-only
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
